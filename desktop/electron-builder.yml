appId: io.dsc.desktop
productName: Muse Code
directories:
  output: dist
  buildResources: build
# 打包用的 Electron 发行目录：用 devDependencies 里那份（版本与 electron-builder 要的
# electronVersion 一致），不从 GitHub Releases 下载——本机直连 GitHub 不稳
# （ECONNRESET / 600s 超时都撞过），离线可复现也是打包该有的性质。
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
extraResources:
  - from: runtime-staging/dsc-core
    to: dsc-core
  # 主进程用 process.resourcesPath/icon.png 加载（含托盘回退）
  - from: build/icon.png
    to: icon.png
  # 托盘 16px 专用剪影（trayIcon 优先读它，见 electron/main/index.ts）
  - from: build/icon-tray.png
    to: icon-tray.png
afterPack: scripts/after-pack.cjs
asar: true
# Electron 自带 55 个语言包（~49MB）：界面只有中文，留中英两份就够
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: muse-code-setup-${version}.${ext}
portable:
  artifactName: muse-code-portable-${version}.${ext}
