# Pneuma 发行流水线——对齐 dsh 的「演练 / 发布分离」，这里用触发器区分：
#   - 推 v* tag → 真发布：npm 发 CLI 内核 + GitHub Release 挂 Windows 安装器；
#   - 手动 workflow_dispatch → 只做打包演练，安装器留在 workflow artifacts，不外发。
# 前置 secret：NPM_TOKEN（npm publish 用；未配置时 npm 作业如实跳过并警告，不瞎报成功）。
# 版本号约定：根、desktop、ui-shell 三处 package.json 必须同版本，tag 必须等于该版本
# （verify 作业把关）。
#
# ui-shell 跟产品号走的代价要清楚：它的 version 同时是插件清单里的 apiVersion，19 个内置
# 插件按 "@dsc/ui": "^0.8.0" 这种区间声明兼容性，构建期逐个校验（ui-shell/build-plugins.mjs）。
# 所以**改版本号时，19 个插件的 peer 区间要一起改**——忘了改，构建会当场失败并指出是哪个插件，
# 不会静默放行。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # tag 触发时创建 Release 并上传安装器

jobs:
  verify:
    name: 校验 tag 与三处 package.json 版本一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本检查本身只要 node（runner 自带），但下面那条「跑一次 build-plugins」要 pnpm 与依赖：
      # 缺这一步时 2026-10-31 的 v0.8.0 首发直接以 127 停在 verify，npm 与安装器两个作业全被跳过。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 版本四方对账（tag / 根 / desktop / ui-shell）
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./package.json').version")"
          desktop="$(node -p "require('./desktop/package.json').version")"
          shell="$(node -p "require('./ui-shell/package.json').version")"
          if [ "$tag" != "$root" ] || [ "$tag" != "$desktop" ] || [ "$tag" != "$shell" ]; then
            echo "::error::版本不一致：tag v$tag / 根 $root / desktop $desktop / ui-shell $shell —— 三处 package.json 与 tag 必须同版"
            exit 1
          fi
      # 壳版本一变，插件 peer 区间没跟上就构建不出清单：这里先用一次构建把它顶出来，
      # 别等发版打包到一半才发现 19 个插件全被门禁拒掉。
      - name: 校验内置插件的 peer 区间跟得上壳版本
        run: |
          pnpm install --frozen-lockfile
          # ui-shell 里的脚本名是 build:plugins（build 整体那条会连 vite 一起跑，这里只要清单）。
          pnpm -C ui-shell run build:plugins

  npm:
    name: npm 发布 CLI 内核
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装并编译
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 发布（未配 NPM_TOKEN 则跳过）
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::secret NPM_TOKEN 未配置，跳过 npm 发布；到仓库 Settings → Secrets and variables → Actions 配置后重跑 npm 作业，或本地 npm publish"
            echo "published=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish
          echo "published=1" >> "$GITHUB_OUTPUT"
      - name: 核对 npm 上的版本
        if: steps.publish.outputs.published == '1'
        shell: bash
        # npm 对新包有时先回 202（处理中），过几秒到几分钟才查得到；轮询 5 分钟再判失败，
        # 免得「发布成功但立刻查不到」被误报成失败。
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "npm 上已有 $name@$version"
              exit 0
            fi
            echo "第 $attempt 次还没查到，等 10 秒"
            sleep 10
          done
          echo "::error::npm 上查不到 $name@$version（发布后等了 5 分钟仍未生效）"
          exit 1

  desktop:
    name: Windows 安装器 + GitHub Release
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 构建内核与前端产物（prepare-runtime 吃根 lib；缺壳产物 app 会回落旧渲染层）
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # 三个前端产物跟着根 workspace 的安装走（2026-10-28 起四个项目收成一个 workspace，
          # 不再各自 install）：壳 → lib/ui/assets + lib/ui/plugins（桌面与手机页都是它）；
          # 经典远程页 → lib/remote/assets。
          # 2026-10-15 第一次发 0.7.0 时这两条漏了——包里没有壳产物，app 静默回落到旧渲染层
          # （冒烟截图里是「会话用量」的旧界面才发现）。
          pnpm build:ui
          pnpm -C remote-web build
      - name: 打包安装器（nsis + portable）
        working-directory: desktop
        shell: bash
        run: |
          pnpm exec electron-vite build
          node scripts/prepare-runtime.mjs
          # electron-builder.yml 的 electronDist 指着 node_modules/electron/dist（本地份：开发机直连
          # GitHub 不稳，见那份配置的注释）；CI 上这份 dist 不会自己出现——pnpm 默认拦 electron 的
          # postinstall（它只负责下载二进制，被拦掉不影响跑），所以这里显式补一次。
          # 本机已有 dist 时 install.js 会立刻退出（isInstalled 命中），跑一次无副作用。
          node node_modules/electron/install.js
          pnpm exec electron-builder --publish never
      - name: 生成发布正文（取 CHANGELOG 当前版本一节 + 安装说明）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # 正文来源只有一个：仓库里的 CHANGELOG。找不到这一版时脚本给兜底正文并提示，不挡发布。
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" --out release-notes.md
      - name: 发布 GitHub Release（tag 触发才执行）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/pneuma-*.exe
          # 用上面那一步生成的正文；换成 body_path 之后就不再让 GitHub 自动生成一行对比链接
          body_path: release-notes.md
      - name: 演练产物上传 artifacts（手动触发才执行）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pneuma-installers
          path: desktop/dist/pneuma-*.exe
          if-no-files-found: error
