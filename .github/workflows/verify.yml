# 提交闸门：每次推、每个 PR 都先编译一遍。
#
# 为什么要有这道门：原来的 CI 只有 release.yml，它挂在 v* tag 上——主干能不能编译，
# 要等到发版那天才知道。2026-10-28 一天里就红了两次（Preset.replace 缺字段 7 处、
# 附件模块没入库导致 import 找不到），两次都是本地绿灯、干净检出红灯：本机有未跟踪的
# 文件兜着，谁也没发现。
#
# 推门与夜跑分工：
#   - 推 / PR：只放「快」的门（装依赖 + 三处 typecheck + 排版，一分钟级）；
#   - 夜跑 / 手动：那批要跑 7–8 分钟的探针（pnpm check:core，77 条探针 import 编译产物，
#     所以得先 pnpm build）。
#
# 夜跑这条是补上的漏：注释里一直写着「留给夜跑」，但 on: 从来没配 schedule，
# 于是 49 条内核探针一次都没被自动跑过（2026-10-28 补）。
name: Verify

on:
  push:
  pull_request:
  # 每天 18:00 UTC = 北京时间 02:00，避开提交高峰。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# 同一个分支连着推两次，取消上一次——门禁只关心最终状态。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 内核编译与排版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 编译（src/ 全量，--noEmit）
        run: pnpm typecheck
      - name: 排版闸门（制表符 / 行尾空白 / BOM / 混用行尾 / 末尾缺换行）
        run: pnpm run check:style

  ui:
    name: 界面壳编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 四个项目收成一个 workspace 之后，根安装一次就够（各自那份 node_modules 由 pnpm 链接）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 编译界面壳
        working-directory: ui-shell
        run: pnpm typecheck

  desktop:
    name: 桌面端编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts：typecheck 只用 electron 的类型声明，不需要它下载运行时二进制
      # （那一步在 CI 上又慢又容易挂）。
      # --ignore-scripts：typecheck 只用 electron 的类型声明，不需要它下载运行时二进制
      # （那一步在 CI 上又慢又容易挂）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 编译（主进程 + 渲染层两套 tsconfig）
        working-directory: desktop
        run: pnpm typecheck

  probe:
    name: 夜跑全量自检（49 条内核探针，约 8 分钟）
    # 只在夜跑与手动触发时跑：推一次就等 8 分钟的门，没人会去修红灯。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 探针里有 77 条 import ../lib 的编译产物，不先 build 会整片模块找不到。
      - name: 编译内核
        run: pnpm build
      - name: 全量自检
        run: pnpm run check:core
