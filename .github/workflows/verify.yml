# 提交闸门：每次推、每个 PR 都先编译一遍。
#
# 为什么要有这道门：原来的 CI 只有 release.yml，它挂在 v* tag 上——主干能不能编译，
# 要等到发版那天才知道。2026-10-28 一天里就红了两次（Preset.replace 缺字段 7 处、
# 附件模块没入库导致 import 找不到），两次都是本地绿灯、干净检出红灯：本机有未跟踪的
# 文件兜着，谁也没发现。
#
# 推门与夜跑分工：
#   - 推 / PR：放「值得等」的门（装依赖 + 三处 typecheck + 排版，一分钟级；
#     加上 2026-11-13 迁进 Vitest 的 119 条包级测试，秒级，跟着 pnpm test 一起跑）；
#   - 夜跑 / 手动：两套探针（内核 + 界面）。内核那批每条都要 import 编译产物，所以先
#     pnpm build；界面那批要读插件产物，所以先 pnpm -C ui-shell build。
#
# 夜跑这条是补上的漏：注释里一直写着「留给夜跑」，但 on: 从来没配 schedule，
# 于是内核探针一次都没被自动跑过（2026-10-28 补）。
#
# 界面探针（2026-10-28 补的第二半）：39 条纯 Node 探针 + 4 条要真 Chromium 的 e2e，
# 此前只有 package.json 里的一条命令，谁本地想得起来才跑——壳那两万九千行与十九个插件
# 于是没有任何自动化回归。放在夜跑而不是推门：它要先 build 插件产物，一分钟起步，
# 不值得让每个 PR 都等；夜跑 + 手动足够发现「合进去才发现壳是坏的」。
name: Verify

on:
  push:
  pull_request:
  # 每天 18:00 UTC = 北京时间 02:00，避开提交高峰。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# 同一个分支连着推两次，取消上一次——门禁只关心最终状态。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 内核编译与排版（Node ${{ matrix.node }}）
    # Node 版本矩阵（P6）：engines 是 >=22.19，本仓库的支持面底线是 22，同时验 24
    # （当前开发机版本）——两个都绿才允许合。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 编译（src/ 全量，--noEmit）
        run: pnpm typecheck
      # 测试文件被根 tsconfig 排除（不进主构建、不随包发布），所以它们唯一的类型检查入口
      # 就是这条。少了它，Vitest 只用 esbuild 剥类型、不校验类型，夹具里把字段写错
      # 也不会有人发现，直到某天本地跑一次。
      - name: 测试代码的类型检查（两份 tsconfig：node 侧 + 界面半）
        run: pnpm run typecheck:spec
      - name: 排版闸门（制表符 / 行尾空白 / BOM / 混用行尾 / 末尾缺换行）
        run: pnpm run check:style
      # unit + ui + tui 三层（2026-11-14 起 221 文件 / 2500+ 条）。JUnit 报告同时落一份，
      # 失败时能在 Actions 的 artifact 里逐用例看（P6 flake 治理：报告 + 耗时历史）。
      - name: 单元、界面与 TUI 测试
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/unit-${{ matrix.node }}.xml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports-${{ matrix.node }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  integration:
    name: 集成测试分片（${{ matrix.shard }}/3）
    # 分片（P6）：每个文件都要起一次真内核，单 job 串行太慢；按 Vitest 的 --shard 切三片并行。
    # 每片各自 build（1-2 分钟）换来不用搞构建产物缓存，简单可靠优先。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # test:int 脚本里是「build && vitest」，分片需要把 vitest 单独拎出来加 --shard，
      # 所以这里手动分两步（build 的新鲜度守卫口径不变）。
      - name: 编译内核
        run: pnpm run build
      - name: 集成测试（分片 ${{ matrix.shard }}）
        run: pnpm exec vitest run --project integration --shard=${{ matrix.shard }}/3 --reporter=default --reporter=junit --outputFile.junit=reports/int-${{ matrix.shard }}.xml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-${{ matrix.shard }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  bench:
    name: 性能基准（对比本机基线）
    # 为什么不并进 integration 的分片 job：基准计时对并发敏感，三个分片一起跑等于把
    # 三条基准放在三倍负载下录数；而且分片跑三次基准会写出三份基线。
    #
    # 判据分两层（设计 §9.2「基线绑机器」）：
    #   - 结构判据（每条基准内部的断言：B4 必须是 2 次通知、B1 服务面齐备、B3 压缩产出
    #     正确）**跨机器都成立**，红了就是代码问题，直接闸；
    #   - 数值判据（中位数 > 基线 × 1.5）只在 runner 与基线一致时生效。共享 runner 换
    #     代次后数值整体平移，`run.mjs` 会打印「runner 不同，只记录不判退化」并绿——要
    #     恢复数值闸，从 Actions 日志里取本次中位数、按同格式提交 baseline.json 的
    #     runner 段（人工审一次，别让一次抖动被钉成「正常」）。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 基准只认构建产物 lib/**（plain node，不经 tsx）：不 build 就是拿旧 lib 录数。
      - name: 编译内核
        run: pnpm run build
      - name: 性能基准（对比本机基线；runner 不符时只记录）
        run: pnpm run test:bench

  cli:
    name: 真入口 e2e（bin/dsc.js）
    # 设计 §11：spawn 用户真正会敲的那条命令，验「启动器自己坏了」——参数翻译、子进程
    # 转发、退出码传递。这一层起的是 lib 产物平面，必须先 build；单条 2–5 秒，八条
    # 加起来不到 10 秒，放 PR 门不亏。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 编译内核
        run: pnpm run build
      - name: 真入口 e2e
        run: pnpm test:cli --reporter=default --reporter=junit --outputFile.junit=reports/cli.xml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  all-checks-passed:
    name: all-checks-passed（分支保护只认这一个）
    # 聚合 check（P6，对齐 DSH ci.yml 的单一聚合口）：分支保护只要求这一个 check，
    # 不必枚举易变的 job 名；任何一个失败 / 取消 / 跳过都算没过。
    if: always()
    needs: [core, ui, desktop, integration, bench, cli, windows]
    runs-on: ubuntu-latest
    steps:
      - name: 聚合判定
        run: |
          results="${{ toJson(needs.*.result) }}"
          echo "needs 结果：$results"
          if echo "$results" | grep -qv '"success"'; then
            echo "存在未成功的 job，聚合门红。"
            exit 1
          fi

  windows:
    name: Windows 车道（unit + ui + tui）
    # P7 的平台面：路径分隔符、cmd 参与的命令判定、ConPTY/假终端这些「Linux 上永远
    # 绿、Windows 上才红」的地方，只有真 Windows runner 能覆盖。范围刻意收窄到纯测试
    # 三层（不跑 integration：起真内核 + 60s×N 会把单 job 拖到 20 分钟以上；集成层的
    # 平台差异靠开发机与 probe 夜跑兜底）。
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 测试代码的类型检查
        run: pnpm run typecheck:spec
      - name: 单元 / 界面 / TUI 测试
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/unit-windows.xml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports-windows
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: 界面壳编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 四个项目收成一个 workspace 之后，根安装一次就够（各自那份 node_modules 由 pnpm 链接）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 编译界面壳
        working-directory: ui-shell
        run: pnpm typecheck

  desktop:
    name: 桌面端编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts：typecheck 只用 electron 的类型声明，不需要它下载运行时二进制
      # （那一步在 CI 上又慢又容易挂）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      # 桌面端主进程直接引用根项目的编译产物（`@dsc/runtime/*` 经 tsconfig paths 指到 ../lib），
      # 干净检出时那些 d.ts 还不存在，不先编一遍会整片 TS2307。
      - name: 编译内核（桌面端类型指向根 lib）
        run: pnpm build
      - name: 编译（主进程 + 渲染层两套 tsconfig）
        working-directory: desktop
        run: pnpm typecheck

  probe:
    name: 夜跑全量自检（内核探针，约 8 分钟）
    # 只在夜跑与手动触发时跑：推一次就等 8 分钟的门，没人会去修红灯。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 多数探针 import ../lib 的编译产物，不先 build 会整片模块找不到。
      - name: 编译内核
        run: pnpm build
      - name: 内核自检
        run: pnpm run check:core
      # 界面探针读插件产物（lib/ui/plugins/*），所以壳也要先 build。
      - name: 编译界面壳与插件产物
        run: pnpm -C ui-shell build
      - name: 界面自检
        run: pnpm run check:ui
      # 插件门禁放这里而不是 PR 门：它包含 plugin-inventory-check，需要上面刚刚构建出来的
      # lib/ui/plugins/。到这里两份产物都齐了，加这条不多花构建时间。
      # 包级测试已不在这一串里：119 条 2026-11-13 迁进 Vitest，由 PR 门的 pnpm test 覆盖。
      - name: 插件门禁（模型 / 包标准 / 清单快照 / 装配 / 热替换）
        run: pnpm run check:plugin
      # 真机 e2e 档（2026-11-14 起）：ui-*_e2e 探针要 Electron 的 Chromium，
      # 上面的正常安装（没带 --ignore-scripts）已经把 Electron 二进制拉下来了。
      - name: 界面 e2e 自检（真 Chromium）
        run: pnpm run check:ui:e2e
